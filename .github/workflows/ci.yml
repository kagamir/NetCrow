name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHONUTF8: '1'

jobs:
  check:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked
      - name: End-to-end WSS relay and lifecycle checks
        if: runner.os == 'Linux'
        run: python -u tests/e2e.py target/debug/netcrow
      - name: Release packaging tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -p 'test_release_*.py'

  build:
    name: Binary (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: netcrow
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: netcrow
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: netcrow.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: netcrow.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: netcrow
          - os: macos-15
            target: aarch64-apple-darwin
            binary: netcrow
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET"
      - name: Test native release target
        run: cargo test --locked --release --target "$TARGET" --all-targets
      - name: Smoke-test executable and packaged configuration
        run: |
          "target/$TARGET/release/$BINARY" --version
          "target/$TARGET/release/$BINARY" check --mode relay --config examples/relay.toml
          "target/$TARGET/release/$BINARY" check --mode client --config examples/home.toml
          "target/$TARGET/release/$BINARY" check --mode client --config examples/office.toml
      - name: Check Linux static linkage and release networking
        if: runner.os == 'Linux'
        run: |
          if readelf -l "target/$TARGET/release/$BINARY" | grep -q INTERP; then
            echo 'Linux release unexpectedly requires a dynamic interpreter' >&2
            exit 1
          fi
          if readelf -d "target/$TARGET/release/$BINARY" | grep -q '(NEEDED)'; then
            echo 'Linux release unexpectedly requires shared libraries' >&2
            exit 1
          fi
          python -u tests/e2e.py "target/$TARGET/release/$BINARY"
      - name: Package binary, documentation, and examples
        run: python scripts/package-release.py --target "$TARGET" --tag="$RELEASE_TAG" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netcrow-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  publish:
    name: Publish tag release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: netcrow-*
          path: dist
          merge-multiple: true
      - name: Require all six packages and generate SHA-256 manifest
        run: python scripts/package-release.py --checksums dist
      - name: Complete and verify release assets
        shell: bash
        run: python scripts/publish-release.py --tag="$RELEASE_TAG" --assets dist
