name: Recover v0.1.0 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-v0.1.0.yml']

permissions:
  contents: read

concurrency:
  group: netcrow-recover-v0.1.0
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Verify original build provenance
        run: |
          python - <<'PY'
          import json
          import subprocess

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))

          expected = '77ef63d29921decd7ba8721f37b9be43a25d52fb'
          run = api('repos/kagamir/NetCrow/actions/runs/43995045884')
          tag = api('repos/kagamir/NetCrow/git/ref/tags/v0.1.0')
          assert run['head_sha'] == expected and run['event'] == 'push', run
          assert run['path'] == '.github/workflows/ci.yml', run['path']
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == expected, tag
          jobs = api('repos/kagamir/NetCrow/actions/runs/43995045884/jobs?filter=all&per_page=100')['jobs']
          completed = [job for job in jobs if job['conclusion'] == 'success']
          assert len([job for job in completed if job['name'].startswith('Binary (')]) == 6
          assert len([job for job in completed if job['name'].startswith('Test (')]) == 3
          print('Verified six successful original tag builds and three test jobs.')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 43995045884
          pattern: netcrow-*
          path: dist
          merge-multiple: true
      - name: Restore original binaries and verify public release
        run: python scripts/publish-release.py --tag="$RELEASE_TAG" --assets dist
