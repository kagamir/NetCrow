# 公司客户端：发布子网，不监听本地代理。
id = "office"
token = "REPLACE_WITH_RANDOM_OFFICE_TOKEN"
relay_addr = "relay.example.com:443/netcrow"
# relay_sni 默认使用 relay_addr 中的域名或 IP；空字符串表示不发送 SNI。
# relay_sni = "relay.example.com"
# relay_sni = ""
# shared_subnets 是本机对外共享范围，与代理分流用的 proxy_subnets 不同。
shared_subnets = ["192.168.1.0/24"]

[tls]
# 必须替换为中继 fingerprint 命令的实际输出；此占位指纹不会信任实际中继。
spki_sha256 = "sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

[connection]
idle_secs = 600
sleep_secs = 10
probe_secs = 2
heartbeat_secs = 20
heartbeat_timeout_secs = 60
reconnect_secs = 3
open_timeout_secs = 90
connect_timeout_secs = 10
max_streams = 256

# 按需取消注释并替换成你控制的公开 HTTPS 页面。
# 仅 disable：命中停用，全部未命中恢复；仅 enable：命中恢复，全部未命中停用。
# 两组都配置：停用优先，两组都未命中保持现状；请求失败不算未命中。
# [control]
# initially_disabled = false
# interval_secs = 60
# timeout_secs = 10
# max_body_bytes = 1048576
#
# [[control.disable]]
# url = "https://control.example.com/netcrow.txt"
# keyword = 'office=disabled'
# 也可改用 regex = '(?m)^office=disabled$'，keyword 和 regex 二选一。
#
# [[control.enable]]
# url = "https://control.example.com/netcrow.txt"
# keyword = 'office=enabled'
